      no_progress_timeout_seconds: 900
      requested_capabilities:
      - agent
      prompt: Implement AIRA-PROD-ARA-001. Add production-local dispatch metadata and bundle validation profile so public ARA can consume AIRA production experiment outputs through research_lab.yaml and aira_result_bundle only. Preserve existing local agent smoke handoff.
    acceptance:
    - name: AIRA production agent smoke emits bundle
      command: python3 -m aira agent production-smoke --out /tmp/aira_prod_agent_bundle --json >/tmp/aira_prod_agent.json
      required: true
